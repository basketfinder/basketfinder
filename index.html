<!DOCTYPE html>
<html>
<head>
<title>BasketFinder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
font-family:Arial;
background:#111;
color:white;
padding:30px;
}

.container{
max-width:500px;
margin:auto;
background:#222;
padding:20px;
border-radius:15px;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:15px;
background:orange;
border:none;
color:white;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>BasketFinder</h1>

<input id="name" placeholder="Όνομα">

<input id="age" placeholder="Ηλικία">

<input id="height" placeholder="Ύψος">

<select id="position">
<option>Point Guard</option>
<option>Shooting Guard</option>
<option>Small Forward</option>
<option>Power Forward</option>
<option>Center</option>
</select>

<input id="area" placeholder="Περιοχή">

<button>Δημιουργία Προφίλ</button>

</div>

</body>
</html>
