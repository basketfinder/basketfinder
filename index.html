
<!DOCTYPE html>
<html>
<head>
<title>BasketFinder</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.header{
background:#000;
padding:20px;
display:flex;
justify-content:space-between;
}

.logo{
color:#ff7a00;
font-size:30px;
font-weight:bold;
}

.hero{
text-align:center;
padding:100px;
}

h1{

}

border:none;
padding:15px 30px;

border-radius:10px;

}

.cards{

justify-content:center;

.card{

<body>

<div class="header">

<div>

</div>
</div>

<div class="hero">

<p>Η μεγαλύτερη κοινότητα ερασιτεχνικού μπάσκετ στην Ελλάδα</p>

<button>Είμαι Παίκτης</button>
<button>Είμαι Ομάδα</button>

</div>

<div class="cards">

<div class="card">
<h2>Παίκτες</h2>
<p>Βρες παίκτες στην περιοχή σου</p>
</div>

<div class="card">
<h2>Ομάδες</h2>
<p>Βρες ομάδες σε όλη την Ελλάδα</p>
</div>

<div class="card">
<h2>Τουρνουά</h2>
<p>3x3 και Events</p>
</div>

</div>

</body>
</html>
