<!DOCTYPE html>
<html>
<head>
<title>BasketFinder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
font-family:Arial;
background:#111;
color:white;
display:flex;
justify-content:center;
padding:40px;
}

.container{
width:500px;
background:#222;
padding:25px;
border-radius:15px;
}

input,select,button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
background:orange;
color:white;
font-size:18px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>BasketFinder</h1>

<input id="name" placeholder="Όνομα">

<input id="age" placeholder="Ηλικία">

<input id="height" placeholder="Ύψος">

<select id="position">
<option>Point Guard</option>
<option>Shooting Guard</option>
<option>Small Forward</option>
<option>Power Forward</option>
<option>Center</option>
</select>

<input id="area" placeholder="Περιοχή">

<button id="saveBtn" type="button">
Δημιουργία Προφίλ
</button>

</div>

<script>

const SUPABASE_URL="https://fjfjnjqbpxgdxqaufzfv.supabase.co/rest/v1/"
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqZmpuanFicHhnZHhxYXVmemZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NTAxOTcsImV4cCI6MjA5NTMyNjE5N30.cy8u_z7iDx1JWv-Ee2jC6P5NfK7-P1Z-2xwmLqAlAlI"

const supabase=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document.getElementById("saveBtn").onclick=async()=>{

const name=document.getElementById("name").value;
const age=document.getElementById("age").value;
const height=document.getElementById("height").value;
const position=document.getElementById("position").value;
const area=document.getElementById("area").value;

const {error}=await supabase
.from("players")
.insert([{
name,
age,
height,
position,
area
}]);

if(error){
alert("Σφάλμα αποθήκευσης");
console.log(error);
}else{
alert("Το προφίλ αποθηκεύτηκε!");
}

};

</script>

</body>
</html>
