<!DOCTYPE html>
<html>

<head>
<title>BasketFinder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial;
background:#111;
display:flex;
justify-content:center;
padding:50px;
color:white;
}

.container{
width:500px;
background:#222;
padding:25px;
border-radius:15px;
}

input,select,button{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
box-sizing:border-box;
}

button{
background:orange;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>BasketFinder</h1>

<input id="name" placeholder="Όνομα">

<input id="age" placeholder="Ηλικία">

<input id="height" placeholder="Ύψος">

<select id="position">
<option>Point Guard</option>
<option>Shooting Guard</option>
<option>Small Forward</option>
<option>Power Forward</option>
<option>Center</option>
</select>

<input id="area" placeholder="Περιοχή">

<button type="button" onclick="savePlayer()">
Δημιουργία Προφίλ
</button>

</div>

<script>
function savePlayer(){
alert("Το κουμπί πατήθηκε!");
}
</script>

</body>
</html>
